name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

    - name: Setup release signing
      if: ${{ secrets.KEYSTORE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Prepare release APK
      id: version
      shell: bash
      run: |
        version_name=$(sed -n 's/.*bitchordVersionName.*"\([^"]*\)".*/\1/p' build.gradle.kts)
        test -n "$version_name"
        echo "name=$version_name" >> "$GITHUB_OUTPUT"
        apk=$(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*universal*.apk' -print -quit)
        if [ -z "$apk" ]; then
          apk=$(find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' -print -quit)
        fi
        test -f "$apk"
        cp "$apk" "BitChord-v${version_name}.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: BitChord-v*.apk

    - name: Publish latest release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.name }}
        name: BitChord v${{ steps.version.outputs.name }}
        target_commitish: ${{ github.sha }}
        make_latest: true
        generate_release_notes: true
        overwrite_files: true
        fail_on_unmatched_files: true
        files: BitChord-v*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
