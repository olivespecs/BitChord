name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      shell: bash
      run: |
        test -n "$KEYSTORE_BASE64" || {
          echo "::error::KEYSTORE_BASE64 is required to build an APK that updates the installed app."
          exit 1
        }
        printf '%s' "$KEYSTORE_BASE64" | base64 --decode > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties

    - name: Build production release APK
      run: ./gradlew :app:assembleProdRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release
        path: app/build/outputs/apk/prod/release/*.apk
        if-no-files-found: error
